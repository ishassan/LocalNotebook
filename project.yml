name: LocalNotebook
options:
  bundleIdPrefix: com.localnotebook
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Config/Info.plist
    PRODUCT_NAME: LocalNotebook
    SUPPORTS_MACCATALYST: NO
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  LocalNotebook:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LocalNotebookApp
        excludes:
          - "**/.DS_Store"
      - path: Resources
    postBuildScripts:
      - name: Process Python Runtime
        shell: /bin/zsh
        script: |
          set -eu
          FRAMEWORK="$PROJECT_DIR/Vendor/PythonRuntime/Python.xcframework"
          if [ ! -f "$FRAMEWORK/build/utils.sh" ]; then
            echo "error: Missing Python.xcframework. Run ./Scripts/bootstrap_python_runtime.sh first."
            exit 1
          fi
          source "$FRAMEWORK/build/utils.sh"
          install_python "Vendor/PythonRuntime/Python.xcframework"
          PYTHON_VER=$(ls -1 "$CODESIGNING_FOLDER_PATH/python/lib" | grep -E '^python3\\.[0-9]+$' | head -n 1)
          mkdir -p "$CODESIGNING_FOLDER_PATH/python/lib/$PYTHON_VER/site-packages"
          rsync -au "$PROJECT_DIR/Vendor/PythonRuntime/packages/" "$CODESIGNING_FOLDER_PATH/python/lib/$PYTHON_VER/site-packages/"
          mkdir -p "$CODESIGNING_FOLDER_PATH/PythonApp"
          rsync -au "$PROJECT_DIR/Resources/PythonApp/" "$CODESIGNING_FOLDER_PATH/PythonApp/"
          mkdir -p "$CODESIGNING_FOLDER_PATH/SampleNotebooks"
          rsync -au "$PROJECT_DIR/Resources/SampleNotebooks/" "$CODESIGNING_FOLDER_PATH/SampleNotebooks/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localnotebook.ios
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_TESTABILITY: YES
        SWIFT_OBJC_BRIDGING_HEADER: LocalNotebookApp/Support/LocalNotebook-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Vendor/PythonRuntime
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(BUILT_PRODUCTS_DIR)/Python.framework/Headers
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
    dependencies:
      - framework: Vendor/PythonRuntime/Python.xcframework
        embed: true
    scheme:
      gatherCoverageData: true
      testTargets:
        - LocalNotebookTests
        - LocalNotebookUITests
  LocalNotebookTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LocalNotebookTests
    dependencies:
      - target: LocalNotebook
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LocalNotebook.app/LocalNotebook
        BUNDLE_LOADER: $(TEST_HOST)
  LocalNotebookUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LocalNotebookUITests
    dependencies:
      - target: LocalNotebook
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        TEST_TARGET_NAME: LocalNotebook
